
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-grafana-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: "in-cluster"
    namespace: glueops-core-monitoring
  project: glueops-core
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m0s
      limit: 5
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    chart: grafana
    targetRevision: 10.5.15
    helm:
      skipCrds: true
      values: |-
        adminPassword: "{{ .Values.grafana.admin_password }}"
        sidecar:
         dashboards:
          enabled: true
          label: grafana_developer_dashboard
          searchNamespace: glueops-core-monitoring
          defaultDatasourceEnabled: false
          isDefaultDatasource: true
          url: http://glueops-core-thanos-query.glueops-core-monitoring:9090/
          name: Prometheus
          uid: prometheus
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                url:  http://glueops-core-thanos-query.glueops-core-monitoring:9090/
                isDefault: true
              - name: Loki
                type: loki
                url: http://glueops-core-loki-gateway.glueops-core-monitoring.svc.cluster.local
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                  timeout: 900
                secureJsonData:
                  httpHeaderValue1: "{{ .Values.captain_domain }}"
              - name: Tempo
                type: tempo
                uid: de7lydl3hl9fkd
                url: http://glueops-core-tempo-query-frontend.glueops-core-monitoring:3200
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                  streamingEnabled:
                    search: true
                  nodeGraph:
                    enabled: true
                  serviceMap:
                    datasourceUid: prometheus
                  tracesToMetrics:
                    datasourceUid: prometheus
                secureJsonData:
                  httpHeaderValue1: "{{ .Values.captain_domain }}"    
          
        image:
          registry: {{ .Values.container_images.app_kube_prometheus_stack.grafana.image.registry }}
          repository: {{ .Values.container_images.app_kube_prometheus_stack.grafana.image.repository }}
          tag: {{ .Values.container_images.app_kube_prometheus_stack.grafana.image.tag }}
        plugins:
          - yesoreyeram-infinity-datasource
          - tempo 13.1.5

        assertNoLeakedSecrets: false
        ingress:
          enabled: true
          ingressClassName: platform-traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.middlewares: glueops-core-oauth2-proxy-oauth2-with-redirect@kubernetescrd
          hosts: ['grafana.{{ .Values.captain_domain }}']
          path: "/"
        additionalDataSources:
        - name: Loki
          type: loki
          url: http://glueops-core-loki-gateway.glueops-core-monitoring.svc.cluster.local
          jsonData:
            httpHeaderName1: "X-Scope-OrgID"
            timeout: 900
          secureJsonData:
            httpHeaderValue1: "{{ .Values.captain_domain }}"
        - name: Tempo
          type: tempo
          uid: de7lydl3hl9fkd
          url: http://glueops-core-tempo-query-frontend.glueops-core-monitoring:3200
          jsonData:
            httpHeaderName1: "X-Scope-OrgID"
            streamingEnabled:
              search: true
            nodeGraph:
              enabled: true
            serviceMap:
              datasourceUid: prometheus
            tracesToMetrics:
              datasourceUid: prometheus
          secureJsonData:
            httpHeaderValue1: "{{ .Values.captain_domain }}"
           
        grafana.ini:
          timeout: 900
          dataproxy:
            timeout: 900
            dataproxy_row_limit: 1000000
          plugin.tempo:
            as_external: true
          users:
            viewers_can_edit: true
          server:
            root_url: "https://grafana.{{ .Values.captain_domain }}/"
          auth.generic_oauth:
            enabled: true
            allow_sign_up: true
            name: GitHub SSO
            client_id: grafana
            client_secret: "{{ .Values.dex.grafana.client_secret }}"
            scopes: "openid profile email groups"
            auth_url: https://dex.{{ .Values.captain_domain }}/auth
            token_url: https://dex.{{ .Values.captain_domain }}/token
            api_url: https://dex.{{ .Values.captain_domain }}/userinfo
            ssl_verify: false
            org_attribute_path:   
            role_attribute_path: contains(groups[*], '{{ .Values.grafana.github_admin_org_name }}:{{ .Values.grafana.github_admin_team_name }}') && 'Admin' || 'Viewer'

      
