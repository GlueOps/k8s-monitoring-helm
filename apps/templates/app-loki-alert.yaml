apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-loki-alert-group-controller
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: "in-cluster"
    namespace: glueops-core-monitoring
  project: glueops-core
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
      limit: 2
  source:
    repoURL: https://helm.gpkg.io/project-template
    chart: app
    targetRevision: 0.13.0
    helm:
      values: |
        # Not {{ .Release.Name }}: this string is rendered by the umbrella (release "glueops-core-monitoring"), which
        # named the Deployment/Service after the umbrella while the CompositeController hooks below point at
        # glueops-core-loki-alert-group-controller — so metacontroller could never reach the sync/finalize webhooks.
        appName: 'glueops-core-loki-alert-group-controller'
        image:
          registry: {{ .Values.container_images.app_loki_alert_group_controller.loki_alert_group_controller.image.registry }}
          repository: {{ .Values.container_images.app_loki_alert_group_controller.loki_alert_group_controller.image.repository }}
          tag: {{ .Values.container_images.app_loki_alert_group_controller.loki_alert_group_controller.image.tag }}
          pullPolicy: IfNotPresent
          port: 80

        service:
          enabled: true
          port: 80

        app:
          port: 80
        deployment:
          envVariables:
            - name: LOKI_API_ENDPOINT
              value: 'http://glueops-core-loki-gateway.glueops-core-monitoring.svc.cluster.local'
            - name: ORGANIZATION_ID
              value: '{{ .Values.captain_domain }}'
            - name: SERVER_PORT
              value: '80'  
          {{- toYaml .Values.glueops_node_and_tolerations | nindent 10 }}
          replicas: 2
          enabled: true
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi


        # The lokialertrulegroups.metacontroller.glueops.dev CRD is installed by the
        # platform-crds bundle (glueops/lokialertrulegroups.yaml); only the controller is here.
        customResources:
          - |-
            apiVersion: metacontroller.k8s.io/v1alpha1
            kind: CompositeController
            metadata:
              name: {{ .Release.Name }}
            spec:
              generateSelector: true
              parentResource:
                apiVersion: metacontroller.glueops.dev/v1alpha1
                resource: lokialertrulegroups
              childResources:
                - apiVersion: v1
                  resource: configmaps
                  updateStrategy:
                    method: InPlace
              resyncPeriodSeconds: 30
              hooks:
                sync:
                  webhook:
                    url: http://glueops-core-loki-alert-group-controller.glueops-core-monitoring.svc.cluster.local/sync
                finalize:
                  webhook:
                    url: http://glueops-core-loki-alert-group-controller.glueops-core-monitoring.svc.cluster.local/finalize
                    
        