apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-otel
  annotations:
     argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: "in-cluster"
    namespace: glueops-core-monitoring
  project: glueops-core
  syncPolicy:
    syncOptions:
      - CreateNamespace=true  
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m0s
      limit: 5
  source:
    repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
    chart: opentelemetry-operator
    targetRevision: 0.118.0
    helm:
      # CRDs come from the platform-crds bundle (applied by captain_utils before Argo CD).
      # This chart renders its CRDs as templates (conf/crds/, gated on crds.create), so
      # skipCrds alone is not enough: crds.create must be false too.
      skipCrds: true
      values: |-
        crds:
          create: false
        replicaCount: {{ .Values.otel.replicas }}
        manager:
           {{- toYaml .Values.otel.manager | nindent 12 }}