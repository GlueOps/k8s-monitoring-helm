apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glueops-core-thanos
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: "in-cluster"
    namespace: glueops-core-monitoring
  project: glueops-core
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m0s
      limit: 5
  source:
    repoURL: 'registry-1.docker.io/bitnamicharts'
    chart: thanos
    targetRevision: 17.3.1
    helm:
      skipCrds: true
      values: |-
        objstoreConfig:
        {{- toYaml .Values.thanos.storage | nindent 12 }}
        global:
          security:
            allowInsecureImages: true
        image:
          registry: ghcr.io
          repository: glueops/mirror/bitnami/thanos
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        query:
          replicaLabel: ["__replica__"]
          resources: 
            requests:
              cpu: 2
              memory: 1024Mi
            limits:
               cpu: 3
               memory: 2024Mi
          dnsDiscovery:
            enabled: true
            logLevel: debug
            sidecarsService: "glueops-core-kps-thanos-discovery"
            sidecarsNamespace: "glueops-core-monitoring"
        bucketweb:
          enabled: true
        compactor:
          enabled: true
          retentionResolutionRaw: {{ .Values.thanos.compactor.retention_raw }}
          retentionResolution5m: {{ .Values.thanos.compactor.retention_5m }}
          retentionResolution1h: {{ .Values.thanos.compactor.retention_1h }}
          # Scratch space: must hold the largest single compaction (all input blocks + the output block). Changing the
          # size needs the PVC deleted and recreated unless the storage class supports volume expansion; the data is
          # only a cache (everything lives in object storage).
          persistence:
            size: {{ .Values.thanos.compactor.disk_size }}
          {{- if or (not .Values.thanos.compactor.downsampling_enabled) .Values.thanos.compactor.max_compaction_level }}
          extraFlags:
            {{- if not .Values.thanos.compactor.downsampling_enabled }}
            # 5m/1h downsampled data only helps queries over ranges far longer than the retention we keep.
            - --downsampling.disable
            {{- end }}
            {{- with .Values.thanos.compactor.max_compaction_level }}
            # Caps block size (3 = 2d blocks, Thanos default 4 = 14d). Bounds the compactor's disk need and makes
            # retention granular (a block is deleted only once its newest sample is past retention). Hidden upstream
            # debug flag; the compactor logs a warning when it is below the default. 1h downsampling needs >=10d blocks,
            # so only cap the level when downsampling is disabled or 1h data isn't needed.
            - --debug.max-compaction-level={{ . }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: 2
              memory: 512Mi
            limits:
               cpu: 3
               memory: 2024Mi
        storegateway:
          enabled: true
          {{- with .Values.thanos.storegateway_sync_block_duration }}
          # How often the store gateway re-lists the bucket for new blocks (thanos default 15m).
          extraFlags:
            - --sync-block-duration={{ . }}
          {{- end }}
          useEndpointGroup: true
