prometheus:
  # -- Volume of storage requested for each Prometheus PVC, in Gi
  volume_claim_storage_request: "50"
  kube_controller_manager: false
  kube_scheduler: false
  kube_proxy: false
  kube_api_server: true
  kubelet: true
  service_monitor: false
  kube_state_metric: true
  node_exporter: true
  alertmanager_log_level: info
  retentionSize: "10GB"
  retention: 1d

glueops_node_and_tolerations:
  nodeSelector:
    glueops.dev/role: "glueops-platform"
  tolerations:
    - key: "glueops.dev/role"
      operator: "Equal"
      value: "glueops-platform"
      effect: "NoSchedule"

host_network:
  enabled: true
  external_secrets:
    webhook_port: 45010
  cert_manager:
    webhook_secure_port: 45020
  nginx_public:
    controller:
      host_port:
        ports:
          http: 45030
          https: 45031
  kube_pometheus_stack:
    prometheusOperator:
      tls:
        internal_port: 45040
      admissionWebhooks:
        deployment:
          tls:
            internal_port: 45041

captain_domain: placeholder_captain_domain
# previously (dev cluster): captain_domain: test

thanos:
  compactor:
    # -- raw / 5m / 1h retention in the bucket. With downsampling disabled no 5m/1h blocks are created; keep their
    # retention equal to raw so any existing downsampled blocks are cleaned up too ("0d" would mean keep forever).
    retention_raw: 15d
    retention_5m: 15d
    retention_1h: 15d
    # -- create 5m/1h downsampled blocks (needed for long-range queries over months/years)
    downsampling_enabled: false
    # -- max compaction level (3 = 2-day blocks; empty = Thanos default 4 = 14-day blocks, required for 1h downsampling)
    max_compaction_level: 3
    # -- compactor scratch disk; must fit the largest compaction (~2 days of blocks in + out at level 3)
    disk_size: 20Gi
    # -- merge the two HA Prometheus replicas' blocks into one copy in the bucket (~halves storage). Experimental
    # upstream and irreversible for merged blocks: back up / version the bucket before enabling on a cluster with history.
    dedup_enabled: false
  # -- filled by the platform chart (platform-helm-chart-platform values `thanos.storage`, from terraform
  # `thanos_storage`). Deliberately empty: Helm map-merges values, so any default key here would leak into every
  # tenant's Thanos config. https://thanos.io/tip/thanos/storage.md/
  storage: {}
  # Example of what the platform chart passes (the former default; these keys are rotated/invalid):
  # storage:
  #   type: s3
  #   config:
  #     bucket: nonprodgliese667cconglueopsrocks-eca3-thanos
  #     endpoint: fsn1.your-objectstorage.com
  #     access_key: JYAXBKO07A3I9WK1TXHJ
  #     secret_key: O1ZAocvfDLoYWlkVoD1Fnc2ipAjO73ZTWyCygmLv

loki:
  # -- how long logs are kept (limits_config.retention_period). Must be a multiple of 24h.
  retention_period: 360h
  # -- filled by the platform chart (`loki.storage`, from terraform `loki_storage`); empty for the same reason as thanos.storage.
  # https://grafana.com/docs/loki/latest/configure/#storage_config
  storage: {}
  # Example of what the platform chart passes (the former default; these keys are rotated/invalid):
  # storage:
  #   bucketNames:
  #     chunks: nonprodgliese667cconglueopsrocks-eca3-loki
  #     ruler: nonprodgliese667cconglueopsrocks-eca3-loki
  #     admin: nonprodgliese667cconglueopsrocks-eca3-loki
  #   type: s3
  #   s3:
  #     s3: nonprodgliese667cconglueopsrocks-eca3-loki
  #     endpoint: https://fsn1.your-objectstorage.com
  #     region: us-east-1
  #     accessKeyId: JYAXBKO07A3I9WK1TXHJ
  #     secretAccessKey: O1ZAocvfDLoYWlkVoD1Fnc2ipAjO73ZTWyCygmLv
  #     s3ForcePathStyle: false
  #     insecure: false
  chunkConfig:
    replicas: 2
    maxItemMemory: 2
    allocatedMemory: 2024
    batchSize: 2
    parallelism: 2
    writebackParallelism: 1
    writebackBuffer: 1000
    writebackSizeLimit: 500MB 

otel:
  replicas: 1
  config:

  collector:
    repoURL: https://github.com/GlueOps/otel-resources-helm.git
    # TODO: back to main once GlueOps/otel-resources-helm feat/trace-exporter-retry-queue is merged
    targetRevision: feat/trace-exporter-retry-queue
    path: .

  manager:
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
      tag: "0.152.0@sha256:3c80c1f39d15ec85a894d6ef2dfc19ce77c6050cd627b7cb071708ad67d441c0"
    collectorImage:
      repository: "otel/opentelemetry-collector-contrib"
      tag: 0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
    opampBridgeImage:
      repository: ""
      tag: ""
    targetAllocatorImage:
      repository: ""
      tag: ""
    # The operator's own defaults for its version (versions.txt at the operator tag above), pulled through the
    # ghcr mirror. An empty repository/tag would fall back to the operator's built-in ghcr.io image, bypassing the
    # mirror, so bump these together with manager.image.
    autoInstrumentationImage:
      java:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java"
        tag: "2.28.1@sha256:41b92978e61d13d4f32c6eb20c6ae7821a73ffdec8539bc6a73858e884b411d8"
      nodejs:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs"
        tag: "0.76.0@sha256:ff253cd68f96e372c9925b1dc369ff6d0e1dcd94b8629ddbb47e5dc011b245ad"
      python:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python"
        tag: "0.63b1@sha256:b3921dc289d7040259cca76faa6e53c6712e21c146377d1c9980ce5704e32445"
      dotnet:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet"
        tag: "1.15.0@sha256:93bd2314f6407d00f462fcd4220211ecfecb31d09a8b46a979dbdb287a8eee66"
      apacheHttpd:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-apache-httpd"
        tag: "1.0.4@sha256:97ccd0c314b641ed36208502fb78490a030677c4923b03a0841d60ed01727081"
      nginx:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-operator/autoinstrumentation-apache-httpd"
        tag: "1.0.4@sha256:97ccd0c314b641ed36208502fb78490a030677c4923b03a0841d60ed01727081"
      # The Go instrumentation support in the operator is disabled by default.
      # To enable it, set manager.autoInstrumentation.go.enabled (--enable-go-instrumentation).
      go:
        repository: "ghcr.repo.gpkg.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go"
        tag: "v0.24.0@sha256:664715c04cb854ffdbb920ea1289a86b0717f39e46b18e6584caa9e1f2e4d83f"
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi    

tempo:
  # -- filled by the platform chart (`tempo.storage`, from terraform `tempo_storage`); empty for the same reason as thanos.storage.
  # https://grafana.com/docs/tempo/latest/configuration/#storage
  storage: {}
  # Example of what the platform chart passes (same bucket/key scheme as loki/thanos above):
  # storage:
  #   backend: s3
  #   s3:
  #     bucket: nonprodgliese667cconglueopsrocks-eca3-tempo
  #     endpoint: fsn1.your-objectstorage.com
  #     access_key: JYAXBKO07A3I9WK1TXHJ
  #     secret_key: O1ZAocvfDLoYWlkVoD1Fnc2ipAjO73ZTWyCygmLv
  #     insecure: false
  remote_url: ["http://localhost:9090/api/v1/write"]

  compaction_block_retention: "168h"

  # Single-broker Kafka (Deployment + emptyDir) that buffers spans between the Tempo 3 distributors and the
  # block-builders/live-stores. Nothing in it outlives a block-builder cycle, so it has no PVC.
  kafka:
    # -- broker image (KRaft, broker and controller in one process)
    image: docker.io/apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    # -- partitions of the tempo-traces topic; block-builder and live-store run one replica per partition
    partitions: 3
    # -- how long the broker keeps spans; only matters while block-builders are down
    retentionHours: 6
    # -- per-partition byte cap; partitions x this must stay below sizeLimit
    retentionBytesPerPartition: 2147483648
    # -- emptyDir sizeLimit of the broker's log dir (node ephemeral storage); the kubelet evicts the pod past it
    sizeLimit: 10Gi
    # -- JVM heap; keep it under the memory limit, the rest is page cache
    heapOpts: "-Xms1g -Xmx1g"
    # -- broker container resources. The ephemeral-storage request (keep it equal to sizeLimit) makes the scheduler
    # place the broker on a node with room for its log dir instead of one that DiskPressure-evicts it.
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
        ephemeral-storage: 10Gi
      limits:
        memory: 2Gi
    # -- seconds the broker stays bound to a NotReady/unreachable node before it is evicted and rescheduled (k8s default 300)
    nodeFailureTolerationSeconds: 30
    # -- PriorityClass of the broker pod so other workloads can't preempt it; empty leaves the cluster default
    priorityClassName: ""
    # -- max unacknowledged bytes each distributor buffers for Kafka (Tempo default 1 GiB)
    producerMaxBufferedBytes: 268435456

  # -- requests of the Tempo components (the chart sets none, which makes them BestEffort: first to be evicted under
  # node pressure). No limits yet: size those from observed usage.
  resources:
    distributor:
      requests:
        cpu: 100m
        memory: 256Mi
    liveStore:
      requests:
        cpu: 250m
        memory: 1Gi
    blockBuilder:
      requests:
        cpu: 100m
        memory: 512Mi
    metricsGenerator:
      requests:
        cpu: 100m
        memory: 256Mi
    querier:
      requests:
        cpu: 100m
        memory: 256Mi
    queryFrontend:
      requests:
        cpu: 50m
        memory: 128Mi
    backendScheduler:
      requests:
        cpu: 50m
        memory: 64Mi
    backendWorker:
      requests:
        cpu: 100m
        memory: 256Mi
    gateway:
      requests:
        cpu: 50m
        memory: 64Mi

