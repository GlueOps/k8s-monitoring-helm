prometheus:
  # -- Volume of storage requested for each Prometheus PVC, in Gi
  volume_claim_storage_request: "50"
  kube_controller_manager: false
  kube_scheduler: false
  kube_proxy: false
  kube_api_server: true
  kubelet: true
  service_monitor: false
  kube_state_metric: true
  node_exporter: true
  alertmanager_log_level: info
  retentionSize: "10GB"
  retention: 1d

glueops_node_and_tolerations:
  nodeSelector:
    glueops.dev/role: "glueops-platform"
  tolerations:
    - key: "glueops.dev/role"
      operator: "Equal"
      value: "glueops-platform"
      effect: "NoSchedule"

host_network:
  enabled: true
  external_secrets:
    webhook_port: 45010
  cert_manager:
    webhook_secure_port: 45020
  nginx_public:
    controller:
      host_port:
        ports:
          http: 45030
          https: 45031
  kube_pometheus_stack:
    prometheusOperator:
      tls:
        internal_port: 45040
      admissionWebhooks:
        deployment:
          tls:
            internal_port: 45041

captain_domain: placeholder_captain_domain

thanos:
  # -- filled by the platform chart (platform-helm-chart-platform values `thanos.storage`, from terraform
  # `thanos_storage`). Deliberately empty: Helm map-merges values, so any default key here would leak into every
  # tenant's Thanos config. https://thanos.io/tip/thanos/storage.md/
  storage: {}

loki:
  # -- filled by the platform chart (`loki.storage`, from terraform `loki_storage`); empty for the same reason as thanos.storage.
  # https://grafana.com/docs/loki/latest/configure/#storage_config
  storage: {}
  chunkConfig:
    replicas: 2
    maxItemMemory: 2
    allocatedMemory: 2024
    batchSize: 2
    parallelism: 2
    writebackParallelism: 1
    writebackBuffer: 1000
    writebackSizeLimit: 500MB 

otel:
  replicas: 1
  config:

  collector:
    repoURL: https://github.com/GlueOps/otel-resources-helm.git
    targetRevision: v0.1.0
    path: .

  manager:
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
      tag: "0.152.0@sha256:3c80c1f39d15ec85a894d6ef2dfc19ce77c6050cd627b7cb071708ad67d441c0"
    collectorImage:
      repository: "otel/opentelemetry-collector-contrib"
      tag: 0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
    opampBridgeImage:
      repository: ""
      tag: ""
    targetAllocatorImage:
      repository: ""
      tag: ""
    autoInstrumentationImage:
      java:
        repository: "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java"
        tag: "2.7.0"
      nodejs:
        repository: "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs"
        tag: "0.52.1"
      python:
        repository: "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python"
        tag: "0.47b0"
      dotnet:
        repository: ""
        tag: ""
      apacheHttpd:
        repository: ""
        tag: ""
      # The Go instrumentation support in the operator is disabled by default.
      # To enable it, use the operator.autoinstrumentation.go feature gate.
      go:
        repository: ""
        tag: ""
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi    

tempo:
  # -- filled by the platform chart (`tempo.storage`, from terraform `tempo_storage`); empty for the same reason as thanos.storage.
  # https://grafana.com/docs/tempo/latest/configuration/#storage
  storage: {}
  remote_url: ["http://localhost:9090/api/v1/write"]

  compaction_block_retention: "168h"

grafana:
  # @ignored
  github_admin_org_name: placeholder_admin_github_org_name
  # @ignored
  github_admin_team_name: grafana_super_admins
  github_other_org_names: placeholder_tenant_github_org_name
  # -- Default admin password. CHANGE THIS!!!!
  admin_password: placeholder_grafana_admin_password
container_images:
  
  app_kube_prometheus_stack:
    grafana:
      image:
        registry: docker.io
        repository: grafana/grafana
        tag: 13.0.1-security-01@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
  app_loki_alert_group_controller:
    loki_alert_group_controller:
      image:
        registry: ghcr.io
        repository: glueops/metacontroller-operator-loki-rule-group
        tag: 50357243c2743adda4a4477888a1ea89cd9c0a9c@sha256:edf1ab4162db842452257540c9f5a20b4b79c9aaf78523e019f10f3a9338d038    

dex:
  grafana:
    # -- Specify a unique password here. This will be used to connect grafana via OAuth to the Dex IDP. You can create one with in bash `openssl rand -base64 32`
    client_secret: placeholder_dex_grafana_client_secret


