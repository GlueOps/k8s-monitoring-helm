# Values used ONLY by CI and local checks (hack/check-no-crds.sh). Never deployed. The chart's own defaults keep the
# storage blocks empty on purpose (the platform chart fills them), which makes loki/thanos/tempo refuse to render —
# so CI hands them obviously fake buckets shaped like the terraform-substituted blocks.
captain_domain: ci.example.com
loki:
  storage:
    bucketNames:
      chunks: ci-loki
      ruler: ci-loki
      admin: ci-loki
    type: s3
    s3:
      s3: ci-loki
      endpoint: https://s3.example.com
      region: us-east-1
      accessKeyId: ci
      secretAccessKey: ci
      s3ForcePathStyle: false
      insecure: false
thanos:
  storage:
    type: s3
    config:
      bucket: ci-thanos
      endpoint: s3.example.com
      access_key: ci
      secret_key: ci
tempo:
  storage:
    backend: s3
    s3:
      access_key: ci
      secret_key: ci
      bucket: ci-tempo
      endpoint: s3.example.com
      insecure: false
